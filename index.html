{ id:"grammar", title:"2. Vocabulary & Grammar", qs:[
{n:"7",q:'This antique vase, which belongs ______ my grandmother, holds great sentimental value for my family.',opts:['with','to','at','for'],a:1,exp:'Cụm cố định: belong to = thuộc về. “Belongs to my grandmother” nghĩa là thuộc về bà tôi.',tr:'Chiếc bình cổ này, thuộc về bà tôi, có giá trị tình cảm rất lớn đối với gia đình tôi.'},
{n:"8",q:'Food ______ during the political unrest are now threatened with long prison sentences.',opts:['providers','dwellers','hoarder','investors'],a:2,exp:'hoarder (n): người tích trữ. Food hoarders là những người tích trữ thực phẩm. Lưu ý câu gốc dùng danh từ số ít chưa thật khớp với động từ “are”; theo đáp án trang nguồn chọn C.',tr:'Những người tích trữ thực phẩm trong thời kỳ bất ổn chính trị hiện đang bị đe dọa phải chịu án tù dài hạn.'},
{n:"9",q:'As a careful person, Ann always checks her timetable and makes sure she’s available before she ______ her time to a new project.',opts:['spends','avoids','hesitates','commits'],a:3,exp:'commit time to something = dành/cam kết dành thời gian cho việc gì. Đáp án D.',tr:'Là một người cẩn thận, Ann luôn kiểm tra thời gian biểu và đảm bảo mình có thời gian trước khi dành thời gian cho một dự án mới.'},
{n:"10",q:'This job will provide you with ______ experience that may be helpful in the future.',opts:['fashionable','worthless','invaluable','popular'],a:2,exp:'invaluable = vô giá, cực kỳ quý giá. Cụm “invaluable experience” phù hợp nghĩa câu.',tr:'Công việc này sẽ mang lại cho bạn những kinh nghiệm vô giá có thể hữu ích trong tương lai.'},
{n:"11",q:'As technology has advanced, young children are now well-equipped with ______ priced electronic gadgets.',opts:['usefully','popularly','competitively','unavoidably'],a:2,exp:'competitively priced = có mức giá cạnh tranh. Đây là cụm từ thường dùng khi nói về giá cả.',tr:'Khi công nghệ phát triển, trẻ nhỏ ngày nay được trang bị các thiết bị điện tử có mức giá cạnh tranh.'},
{n:"12",q:'Jam: “Nobody in this room has seen James Cameron’s latest movie, ______?”',opts:['has it','hasn’t it','have it','haven’t it'],a:0,exp:'Với chủ ngữ nobody trong câu hỏi đuôi, dùng đại từ it và phần đuôi khẳng định: has it?',tr:'Jam: “Không ai trong phòng này đã xem bộ phim mới nhất của James Cameron, đúng không?”'},
{n:"13",q:'John: “Luckily, the meeting ______ by the time we arrived there.”',opts:['just began','has just begun','would just begin','had just begun'],a:3,exp:'Past perfect (had + V3) diễn tả hành động đã xảy ra trước một thời điểm/hành động trong quá khứ: cuộc họp vừa bắt đầu trước khi chúng tôi đến.',tr:'John: “May mắn là cuộc họp vừa mới bắt đầu vào lúc chúng tôi đến đó.”'},
{n:"14",q:'Becky: “It ______ a luxury, but now it’s a necessity.”',opts:['used to be','would be','was being','had been'],a:0,exp:'used to + V nguyên mẫu diễn tả trạng thái/thói quen từng đúng trong quá khứ nhưng hiện tại không còn nữa.',tr:'Becky: “Trước đây nó từng là thứ xa xỉ, nhưng bây giờ nó là thứ thiết yếu.”'},
{n:"15",q:'Most students prefer to do little homework ______ many teachers find it useful.',opts:['while','as','however','because'],a:0,exp:'while = trong khi, dùng để nối hai ý tương phản: học sinh thích ít bài tập, trong khi giáo viên thấy bài tập hữu ích.',tr:'Hầu hết học sinh thích làm ít bài tập về nhà trong khi nhiều giáo viên thấy bài tập đó hữu ích.'},
{n:"16",q:'Rose: “Which subject do you think is best: Music or Science?” Liam: “______ They’re totally different subjects.”',opts:['It’s very kind of you.','I think you should.','Thanks for your help.','It’s up to you.'],a:3,exp:'It’s up to you = tùy bạn quyết định. Đây là lời đáp phù hợp khi người nói không chọn thay người khác.',tr:'Rose: “Bạn nghĩ môn nào tốt hơn: Âm nhạc hay Khoa học?” Liam: “Tùy bạn thôi. Chúng là hai môn hoàn toàn khác nhau.”'}
]},
{ id:"cloze", title:"3. Cloze Test", passageTitle:"Passage: The military semester", passage:`Secondary students in Ho Chi Minh City have the option to take (17) ______ in the military semester organized by the Youth Union. This two-week program helps students prepare (18) ______ their future life. In the program, adolescents get the (19) ______ to learn basic knowledge about defense and security, national pride, heroic traditions of the Vietnam People’s Army, military discipline, as well as manners of a soldier.

Moreover, young participants can get (20) ______ with community service in the afternoons, including (21) ______ after elderly people in the local nursing home, helping with the housework and planting trees. (22) ______ students have to get used to strict discipline, they say that they get a lot out of the program and their parents can’t help feeling happy to see their children’s improvement in understanding and behavior after joining the program.`, passageVi:`Học sinh trung học tại Thành phố Hồ Chí Minh có thể lựa chọn tham gia học kỳ quân sự do Đoàn Thanh niên tổ chức. Chương trình kéo dài hai tuần này giúp học sinh chuẩn bị cho cuộc sống tương lai. Trong chương trình, thanh thiếu niên có cơ hội học những kiến thức cơ bản về quốc phòng và an ninh, lòng tự hào dân tộc, truyền thống anh hùng của Quân đội nhân dân Việt Nam, kỷ luật quân đội cũng như phong thái của người lính.

Hơn nữa, những người tham gia trẻ tuổi có thể cùng tham gia các hoạt động phục vụ cộng đồng vào buổi chiều, bao gồm chăm sóc người cao tuổi tại viện dưỡng lão địa phương, giúp việc nhà và trồng cây. Mặc dù học sinh phải làm quen với kỷ luật nghiêm ngặt, các em cho biết mình học hỏi được rất nhiều từ chương trình và cha mẹ không khỏi vui mừng khi thấy con tiến bộ về hiểu biết và hành vi sau khi tham gia.`,qs:[
{n:"17",q:'Secondary students in Ho Chi Minh City have the option to take ______ in the military semester organized by the Youth Union.',opts:['role','part','time','side'],a:1,exp:'take part in = tham gia vào. Đây là cụm động từ cố định.',tr:'Học sinh trung học ở Thành phố Hồ Chí Minh có lựa chọn tham gia học kỳ quân sự do Đoàn Thanh niên tổ chức.'},
{n:"18",q:'This two-week program helps students prepare ______ their future life.',opts:['to','at','for','with'],a:2,exp:'prepare for something = chuẩn bị cho điều gì.',tr:'Chương trình kéo dài hai tuần này giúp học sinh chuẩn bị cho cuộc sống tương lai.'},
{n:"19",q:'In the program, adolescents get the ______ to learn basic knowledge about defense and security.',opts:['money','chance','spotlight','benefit'],a:1,exp:'get the chance to do something = có cơ hội làm việc gì.',tr:'Trong chương trình, thanh thiếu niên có cơ hội học những kiến thức cơ bản về quốc phòng và an ninh.'},
{n:"20",q:'Moreover, young participants can get ______ with community service in the afternoons.',opts:['ready','accustomed','together','involved'],a:2,exp:'get together with = cùng tham gia/cùng nhau trong hoạt động. Đáp án C theo đáp án trang nguồn.',tr:'Hơn nữa, những người tham gia trẻ tuổi có thể tham gia các hoạt động phục vụ cộng đồng vào buổi chiều.'},
{n:"21",q:'The activities include ______ after elderly people in the local nursing home.',opts:['looking','taking','putting','making'],a:0,exp:'look after = chăm sóc. Sau include dùng V-ing: looking after.',tr:'Các hoạt động bao gồm chăm sóc người cao tuổi tại viện dưỡng lão địa phương.'},
{n:"22",q:'______ students have to get used to strict discipline, they say that they get a lot out of the program.',opts:['Although','Even','In contrast','However'],a:0,exp:'Although = mặc dù, đứng đầu mệnh đề phụ chỉ sự nhượng bộ. Cấu trúc: Although + clause, main clause.',tr:'Mặc dù học sinh phải làm quen với kỷ luật nghiêm ngặt, các em nói rằng mình học hỏi được rất nhiều từ chương trình.'}
]},
{ id:"reading", title:"4. Reading Comprehension", passageTitle:"Passage: Technology and our lives", passage:`While many people may not understand “Industry 4.0” and other technological changes, they are having a huge impact on almost every aspect of our lives. In the workplace, technology has improved efficiency and productivity of our work. Since the Third Industrial Revolution, which dates back to the 1970s, numerous routine and repetitive tasks have been conducted automatically without human assistance so that employees are freed up to focus on more important and creative tasks.

Advanced software and tools facilitate the practice of working from home. Video conferencing platforms like Zoom and Microsoft Teams make it possible to collaborate across continents in real time without worrying about geographical distances. This flexibility has opened up opportunities for companies to hire the best talent regardless of their geographical locations.

Additionally, the advent of the internet has brought about drastic changes in communicative methods. Through social media platforms like Facebook, Twitter and Instagram, we can make friends with people having common interests around the world, keep in touch with distant relatives and friends, and stay informed about global events. This gives rise to new forms of social interaction and community-building where everyone can interact, share experiences and build networks.

When it comes to how we travel around the city, ride-hailing apps are of great benefit. Apps like GoJek, GrabBike and Xanh SM allow users to book motorbike taxis through their smartphones, view fare estimates and track the arrival of their driver in real time. These services offer a convenient, efficient and often cost-effective way to travel in congested urban areas, compared to traditional motorbike taxis.`, passageVi:`Mặc dù nhiều người có thể không hiểu “Công nghiệp 4.0” và những thay đổi công nghệ khác, chúng đang tác động rất lớn đến hầu hết mọi khía cạnh trong cuộc sống. Tại nơi làm việc, công nghệ đã cải thiện hiệu quả và năng suất công việc. Kể từ cuộc Cách mạng Công nghiệp lần thứ ba, bắt đầu từ những năm 1970, nhiều công việc thường ngày và lặp đi lặp lại đã được tự động hóa mà không cần sự trợ giúp của con người, nhờ đó nhân viên có thể tập trung vào những nhiệm vụ quan trọng và sáng tạo hơn.

Các phần mềm và công cụ tiên tiến tạo điều kiện thuận lợi cho việc làm việc tại nhà. Các nền tảng hội nghị truyền hình như Zoom và Microsoft Teams giúp mọi người cộng tác xuyên lục địa theo thời gian thực mà không phải lo lắng về khoảng cách địa lý. Sự linh hoạt này đã mở ra cơ hội để các công ty tuyển dụng những nhân tài giỏi nhất bất kể vị trí địa lý của họ.

Ngoài ra, sự xuất hiện của Internet đã đem lại những thay đổi mạnh mẽ trong phương thức giao tiếp. Thông qua các nền tảng mạng xã hội như Facebook, Twitter và Instagram, chúng ta có thể kết bạn với những người có cùng sở thích trên khắp thế giới, giữ liên lạc với người thân và bạn bè ở xa, đồng thời cập nhật các sự kiện toàn cầu. Điều này tạo ra những hình thức tương tác xã hội và xây dựng cộng đồng mới, nơi mọi người có thể tương tác, chia sẻ kinh nghiệm và xây dựng mạng lưới quan hệ.

Về cách di chuyển trong thành phố, các ứng dụng gọi xe mang lại nhiều lợi ích. Các ứng dụng như GoJek, GrabBike và Xanh SM cho phép người dùng đặt xe ôm qua điện thoại thông minh, xem giá cước ước tính và theo dõi thời gian tài xế đến theo thời gian thực. So với xe ôm truyền thống, các dịch vụ này mang đến cách di chuyển thuận tiện, hiệu quả và thường tiết kiệm chi phí hơn tại các khu đô thị đông đúc.`,qs:[
{n:"31",q:'People can work effectively and efficiently thanks to technological advances.',opts:['True','False'],a:0,exp:'Đúng. Bài đọc nêu rõ công nghệ đã cải thiện hiệu quả và năng suất công việc.',tr:'Mọi người có thể làm việc hiệu quả nhờ những tiến bộ công nghệ.'},
{n:"32",q:'Teleconferencing helps reduce physical travel.',opts:['True','False'],a:0,exp:'Đúng. Hội nghị truyền hình cho phép cộng tác xuyên lục địa theo thời gian thực mà không cần lo khoảng cách địa lý.',tr:'Hội nghị truyền hình giúp giảm việc phải di chuyển trực tiếp.'},
{n:"33",q:'Social networking sites connect people from different countries.',opts:['True','False'],a:0,exp:'Đúng. Mạng xã hội giúp kết bạn với những người có cùng sở thích trên khắp thế giới.',tr:'Các trang mạng xã hội kết nối mọi người từ những quốc gia khác nhau.'},
{n:"34",q:'Moving around in traditional motorbike taxis is much cheaper than using technology-based riding services.',opts:['True','False'],a:1,exp:'Sai. Bài đọc nói các dịch vụ gọi xe công nghệ thường tiết kiệm chi phí hơn so với xe ôm truyền thống.',tr:'Di chuyển bằng xe ôm truyền thống rẻ hơn nhiều so với sử dụng dịch vụ gọi xe công nghệ.'},
{n:"35",q:'What is NOT mentioned as an aspect of our lives affected by technology?',opts:['Working methods','Communication','Food ordering','Transportation'],a:2,exp:'Đặt đồ ăn (food ordering) không được đề cập. Bài đọc nói về cách làm việc, giao tiếp và giao thông.',tr:'Khía cạnh nào trong cuộc sống KHÔNG được đề cập là chịu ảnh hưởng của công nghệ?'},
{n:"36",q:'What can be inferred from the passage about the effects of technology?',opts:['Technology was first introduced in the late 20th century.','Social networks enable global connection.','Zoom is a cost-effective video conference platform.','People using traditional motorbike taxis know how much they pay for their journey.'],a:1,exp:'Có thể suy ra mạng xã hội tạo điều kiện kết nối toàn cầu vì người dùng có thể kết bạn, giữ liên lạc với người ở xa và cập nhật sự kiện thế giới.',tr:'Có thể suy ra điều gì từ bài đọc về tác động của công nghệ?'}
]},
{ id:"order", title:"5. Sentence Arrangement", qs:[

function unlock(){if(document.getElementById('pw').value==='367'){document.getElementById('login').classList.add('hidden');document.getElementById('exam').classList.remove('hidden');render()}else document.getElementById('pwmsg').textContent='Incorrect password. Try again.'}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
let active=0, states={};
function key(s,i){return s.id+'_'+i}
function render(){
 const tabs=document.getElementById('tabs'),root=document.getElementById('sections');tabs.innerHTML='';root.innerHTML='';
 sections.forEach((s,si)=>{
  states[s.id]=s.qs?s.qs.map(()=>null):s.written.map(()=>null);
  let b=document.createElement('button');b.className='tab'+(si===active?' active':'');b.textContent=s.title;b.onclick=()=>{active=si;renderView()};tabs.appendChild(b);
  let sec=document.createElement('div');sec.className='section'+(si===active?'':' hidden');sec.id='sec_'+s.id;
  sec.innerHTML=`<h2>${s.title}</h2><div class="score" id="score_${s.id}">Score: 0 / ${s.qs?s.qs.length:s.written.length}</div><button class="reset" onclick="resetSection('${s.id}')">Reset this section</button>`;
  if(s.passage){sec.innerHTML+=`<div class="reading-layout"><div class="passage"><h3>${s.passageTitle}</h3>${s.passage}<hr><b>Vietnamese translation</b><br>${s.passageVi}</div><div class="question-side" id="side_${s.id}"></div></div>`}
  else sec.innerHTML+=`<div id="side_${s.id}"></div>`;
  root.appendChild(sec);
  const target=sec.querySelector('#side_'+s.id);
  if(s.qs) s.qs.forEach((q,i)=>target.appendChild(makeQuestion(s,q,i)));
  if(s.written) s.written.forEach((q,i)=>target.appendChild(makeWritten(s,q,i)));
 });
}
function renderView(){sections.forEach((s,i)=>{document.getElementById('sec_'+s.id).classList.toggle('hidden',i!==active);document.querySelectorAll('.tab')[i].classList.toggle('active',i===active)})}
function makeQuestion(s,q,i){
 let box=document.createElement('div');box.className='question'+(i===0?' active':'');box.id='q_'+s.id+'_'+i;
 let question=q.q.replace(/\\n/g,'<br>');
 if(s.id==='pron' && q.under){let opts=q.opts.map((v,j)=>j===3&&q.n==='3'?v.replace('a','<span class="under">a</span>'):q.n==='4'?v.replace('th','<span class="under">th</span>'):v);q._opts=opts}
 box.innerHTML=`<div class="qnum">QUESTION ${q.n}</div><div class="qtext">${question}</div><div class="options"></div><div class="feedback hidden" id="fb_${s.id}_${i}"></div><div class="nav"><button class="secondary" onclick="moveQuestion('${s.id}',${i},-1)" ${i===0?'disabled':''}>Previous</button><span class="small">${i+1} / ${s.qs.length}</span><button onclick="moveQuestion('${s.id}',${i},1)" ${i===s.qs.length-1?'disabled':''}>Next</button></div>`;
 let opts=box.querySelector('.options');(q._opts||q.opts).forEach((v,j)=>{let btn=document.createElement('button');btn.className='opt';btn.innerHTML=String.fromCharCode(65+j)+'. '+v;btn.onclick=()=>choose(s,q,i,j);opts.appendChild(btn)});
 return box;
}
function choose(s,q,i,j){
 if(states[s.id][i]!==null)return;states[s.id][i]=j;
 let box=document.getElementById('q_'+s.id+'_'+i),buttons=[...box.querySelectorAll('.opt')];
 buttons.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('correct');if(k===j&&j!==q.a)b.classList.add('wrong')});
 let good=j===q.a,fb=document.getElementById('fb_'+s.id+'_'+i);fb.className='feedback '+(good?'good':'bad');fb.classList.remove('hidden');
 fb.innerHTML=`<b>${good?'Correct!':'Incorrect.'}</b> Đáp án đúng: <b>${String.fromCharCode(65+q.a)}. ${q.opts[q.a]}</b><div>${q.exp}</div><div class="translation"><b>Nghĩa tiếng Việt:</b> ${q.tr}</div>`;
 updateScore(s);
}
function makeWritten(s,q,i){
 let box=document.createElement('div');box.className='question'+(i===0?' active':'');box.id='q_'+s.id+'_'+i;
 box.innerHTML=`<div class="qnum">QUESTION ${q.n}</div><div class="qtext">${q.q.replace(/\\n/g,'<br>')}</div><div class="write-answer"><input type="text" id="ans_${s.id}_${i}" placeholder="Type your answer here"></div><div style="margin-top:10px"><button onclick="checkWritten('${s.id}',${i})" id="submit_${s.id}_${i}">Check answer</button></div><div class="feedback hidden" id="fb_${s.id}_${i}"></div><div class="nav"><button class="secondary" onclick="moveQuestion('${s.id}',${i},-1)" ${i===0?'disabled':''}>Previous</button><span class="small">${i+1} / ${s.written.length}</span><button onclick="moveQuestion('${s.id}',${i},1)" ${i===s.written.length-1?'disabled':''}>Next</button></div>`;
 return box;
}
function norm(x){return x.toLowerCase().trim().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ')}
function checkWritten(id,i){
 let s=sections.find(x=>x.id===id),q=s.written[i];if(states[id][i]!==null)return;
 let val=document.getElementById('ans_'+id+'_'+i).value;if(!val.trim())return;
 let good=norm(val)===norm(q.answer);states[id][i]=good?1:0;
 document.getElementById('ans_'+id+'_'+i).disabled=true;document.getElementById('submit_'+id+'_'+i).disabled=true;
 let fb=document.getElementById('fb_'+id+'_'+i);fb.className='feedback '+(good?'good':'bad');fb.classList.remove('hidden');
 fb.innerHTML=`<b>${good?'Correct!':'Not quite.'}</b><div><b>Suggested answer:</b> ${q.answer}</div><div>${q.exp}</div><div class="translation"><b>Nghĩa tiếng Việt:</b> ${q.tr}</div>`;
 updateScore(s);
}
function updateScore(s){
 let vals=states[s.id],score=vals.reduce((a,v)=>a+(v===null?0:(s.qs?(v===s.qs[vals.indexOf(v)]?1:0):v)),0);
 // MC stores selected index; calculate by reading correctness marker, written stores 1/0
 if(s.qs) score=vals.reduce((a,v,i)=>a+(v===null?0:(v===s.qs[i].a?1:0)),0);
 document.getElementById('score_'+s.id).textContent=`Score: ${score} / ${vals.length} · Answered: ${vals.filter(v=>v!==null).length}/${vals.length}`;
}
function moveQuestion(id,i,dir){let s=sections.find(x=>x.id===id),n=s.qs?s.qs.length:s.written.length;let next=Math.max(0,Math.min(n-1,i+dir));for(let k=0;k<n;k++)document.getElementById('q_'+id+'_'+k).classList.toggle('active',k===next);document.getElementById('q_'+id+'_'+next).scrollIntoView({behavior:'smooth',block:'start'})}
function resetSection(id){
 let s=sections.find(x=>x.id===id);states[id]=s.qs?s.qs.map(()=>null):s.written.map(()=>null);
 let side=document.getElementById('side_'+id);side.innerHTML='';
 if(s.qs)s.qs.forEach((q,i)=>side.appendChild(makeQuestion(s,q,i)));if(s.written)s.written.forEach((q,i)=>side.appendChild(makeWritten(s,q,i)));
 document.getElementById('score_'+id).textContent=`Score: 0 / ${states[id].length}`;
}
</script>
</body></html>
